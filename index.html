<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PUMO Story Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap">
<style>
:root{
  --ink:#0E1630; --navy:#1F3864; --sky:#E6F0FF; --dot:#C4D7F5; --paper:#FFFFFF; --soft:#F4F8FF;
  --gold:#FFC20E; --orange:#FF9A0D; --blue:#2F6BF2; --green:#16B157; --red:#F2383A; --grey:#5B6787;
  --accent:var(--gold);
  --display:"Fredoka","Baloo 2","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--sky);background-image:radial-gradient(var(--dot) 1.6px,transparent 1.7px);background-size:24px 24px;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;padding-top:env(safe-area-inset-top,0px)}
img{max-width:100%}
h1,h2,h3{font-family:var(--display);line-height:1.02;margin:0;text-wrap:balance}
p{margin:0}
button,input,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* hanging crew */
.hang{position:absolute;width:0;height:0;transform-origin:0 0;animation:swing var(--dur,3.4s) ease-in-out infinite;animation-delay:var(--del,0s);pointer-events:none;z-index:3}
.hang .rope{position:absolute;left:-1px;top:0;width:2px;height:var(--L);background:var(--ink);border-radius:2px}
.hang img{position:absolute;width:var(--sw);max-width:none;left:calc(var(--sw) * var(--hx) * -1);top:calc(var(--L) - var(--sw) * var(--ar) * var(--hy));filter:drop-shadow(0 3px 0 rgba(14,22,48,.18))}
.hang.two .rope{left:calc(var(--sw) * var(--a) - 1px)}
.hang.two .rope+.rope{left:calc(var(--sw) * var(--b) - 1px)}
.hang.two img{left:calc(var(--sw) * -.5)}
@keyframes swing{0%,100%{transform:rotate(var(--amp,8deg))}50%{transform:rotate(calc(var(--amp,8deg) * -1))}}
.jiggle:hover .hang,.jiggle:focus-visible .hang{--amp:20deg;--dur:.8s}
.perch{position:absolute;pointer-events:none;z-index:3;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-6px) rotate(4deg)}}

/* header */
.band{background:var(--navy);color:#FFFFFF}
.band .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;flex-wrap:wrap}
.band .wrap span:last-child{opacity:.75}
.hero{padding-block:34px 10px;text-align:center}
.title{display:inline-block;font-size:clamp(64px,13vw,132px);font-weight:700;letter-spacing:-.02em;line-height:.9;position:relative;margin-bottom:96px}
.title .l{position:relative;display:inline-block;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink)}
.title .c1{color:var(--gold)}.title .c2{color:var(--blue)}.title .c3{color:var(--red)}.title .c4{color:var(--green)}.title .c5{color:#FFFFFF}
.title .sp{display:inline-block;width:.28em}
.sub{font-size:clamp(16px,2.2vw,20px);font-weight:700;color:var(--navy);max-width:640px;margin:0 auto}
.me-row{display:flex;justify-content:center;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-top:20px}
.me-row label{display:flex;flex-direction:column;gap:4px;text-align:left;font-family:var(--display);font-weight:600;font-size:16px}
.me-row input{width:220px}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:26px 0 92px}
.tab{position:relative;display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 var(--ink);text-decoration:none;font-family:var(--display);font-weight:600;font-size:18px;line-height:1.1;transition:transform .15s,box-shadow .15s,background .2s}
.tab .n{flex:none;width:34px;height:34px;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;font-size:17px;background:var(--soft)}
.tab:hover{transform:translateY(-3px);box-shadow:0 9px 0 var(--ink)}
.tab[aria-current="page"]{background:var(--tabc)}
.tab[aria-current="page"] .n{background:#FFFFFF}
.tab small{display:block;font-family:var(--body);font-weight:700;font-size:12px;opacity:.7;letter-spacing:.04em}

/* station chrome */
main{padding-bottom:80px}
.st-head{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.eyebrow{display:inline-block;font-family:var(--display);font-weight:600;font-size:15px;background:var(--ink);color:#FFFFFF;padding:3px 12px;border-radius:999px;margin-bottom:10px}
.st-head h2{font-size:clamp(34px,5vw,54px);position:relative}
.tip{display:flex;gap:12px;align-items:center;background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:10px 14px;max-width:520px;font-weight:600;font-size:15px;box-shadow:0 5px 0 var(--ink)}
.tip img{width:46px;flex:none}
.box{background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:0 7px 0 var(--ink);padding:22px;min-width:0;position:relative}
.box h3{font-size:26px;margin-bottom:4px}
.box .lede{color:var(--grey);font-weight:600;font-size:15px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:26px;align-items:start}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.mt{margin-top:26px}
label.f{display:flex;flex-direction:column;gap:5px;font-family:var(--display);font-weight:600;font-size:17px}
label.f .hint{font-family:var(--body);font-weight:600;font-size:13px;color:var(--grey)}
.field{display:flex;gap:8px}
input[type=text],textarea{width:100%;min-width:0;background:var(--soft);border:2.5px solid var(--ink);border-radius:12px;padding:10px 12px;font-size:15.5px;font-weight:600}
textarea{resize:vertical;min-height:70px}
input[type=text]:focus,textarea:focus{outline:none;background:#FFFFFF;box-shadow:0 0 0 4px var(--accent)}
input[type=range]{accent-color:var(--navy);width:100%}
::placeholder{color:#8A94AE;font-weight:600}
.btn{appearance:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px;border:3px solid var(--ink);border-radius:14px;padding:9px 16px;font-family:var(--display);font-weight:600;font-size:17px;background:var(--paper);color:var(--ink);box-shadow:0 5px 0 var(--ink);text-decoration:none;position:relative;transition:transform .1s,box-shadow .1s}
.btn:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--ink)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.main{background:var(--accent)}
.btn.big{font-size:21px;padding:13px 22px;border-radius:18px}
.btn.sm{font-size:14px;padding:5px 11px;border-width:2.5px;box-shadow:0 4px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.dice{appearance:none;flex:none;width:48px;border:2.5px solid var(--ink);border-radius:12px;background:var(--gold);cursor:pointer;display:grid;place-items:center;box-shadow:0 4px 0 var(--ink);transition:transform .1s}
.dice:active{transform:translateY(3px) rotate(20deg);box-shadow:0 1px 0 var(--ink)}
.dice svg{width:24px;height:24px}
.ai-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:6px;padding-bottom:6px}
.ai{justify-content:center;flex-direction:column;gap:0;padding:10px 8px;text-align:center}
.ai b{font-size:20px}
.ai small{font-family:var(--body);font-weight:700;font-size:12px;opacity:.75}
.ai.g{background:#E7F0FF}.ai.c{background:#E3FAEC}.ai.a{background:#FFE9DC}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,24px);background:var(--ink);color:#FFFFFF;font-weight:700;padding:11px 20px;border-radius:999px;opacity:0;transition:.25s;pointer-events:none;z-index:30;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.copyfall{margin-top:10px}.copyfall textarea{min-height:110px;font-size:13px}
.note{font-size:13px;color:var(--grey);font-weight:600}

.ticket{background:var(--soft);border:2.5px dashed var(--ink);border-radius:16px;padding:16px 18px;font-size:16px;font-weight:600;line-height:1.7;white-space:pre-line;overflow-wrap:anywhere}
.ticket mark{background:var(--gold);color:var(--ink);border-radius:6px;padding:0 5px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.ticket mark.empty{background:#FFD9D9;color:var(--red)}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:18px}
.step{display:flex;gap:10px;align-items:center;font-weight:700;font-size:14px}
.step i{flex:none;font-style:normal;width:30px;height:30px;border-radius:50%;border:2.5px solid var(--ink);display:grid;place-items:center;font-family:var(--display);background:var(--accent)}

/* character card */
.cardwrap{perspective:900px;display:flex;justify-content:center}
.tcard{width:100%;max-width:370px;background:var(--gold);border:4px solid var(--ink);border-radius:24px;padding:12px;box-shadow:0 10px 0 var(--ink);transform-style:preserve-3d;transition:transform .2s}
.tcard .inner{background:#FFFFFF;border:3px solid var(--ink);border-radius:16px;overflow:hidden}
.tcard .top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;background:var(--navy);color:#FFFFFF}
.tcard .nm{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.05;overflow-wrap:anywhere}
.tcard .no{font-family:var(--display);font-size:13px;opacity:.8;flex:none}
.pic{position:relative;aspect-ratio:1/0.9;display:grid;place-items:center;cursor:pointer;background:repeating-conic-gradient(from 0deg at 50% 60%,#FFE79A 0 10deg,#FFF5CF 10deg 20deg);border-bottom:3px solid var(--ink)}
.pic img{max-width:88%;max-height:88%;object-fit:contain;filter:drop-shadow(0 6px 0 rgba(14,22,48,.2))}
.pic .drop{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-family:var(--display);font-weight:600;font-size:17px;padding:16px;border:3px dashed var(--ink);border-radius:16px;background:rgba(255,255,255,.75)}
.pic .drop small{font-family:var(--body);font-size:12.5px;font-weight:700;color:var(--grey)}
.pic.over{outline:5px solid var(--blue);outline-offset:-8px}
.tcard .look{padding:8px 12px 0;font-size:13px;font-weight:700;color:var(--grey);min-height:24px;overflow-wrap:anywhere}
.tcard dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 10px;margin:0;padding:8px 12px 12px;font-size:14px;font-weight:700}
.tcard dt{font-family:var(--display);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.06em;align-self:center;background:var(--ink);color:#FFFFFF;border-radius:6px;padding:1px 7px;text-align:center}
.tcard dd{margin:0;overflow-wrap:anywhere}
.tcard .foot{display:flex;justify-content:space-between;font-family:var(--display);font-weight:600;font-size:12px;padding:8px 6px 0;color:var(--ink)}
.bgtools{background:var(--soft);border:2.5px solid var(--ink);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:14px}
.switch{display:flex;align-items:center;gap:8px;cursor:pointer}
.switch input{width:20px;height:20px;accent-color:var(--green)}

/* brainstorm */
.logline{font-family:var(--display);font-weight:600;font-size:clamp(22px,3vw,32px);line-height:1.45}
.slot{border:2.5px solid var(--ink);border-radius:10px;padding:0 8px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.k1{background:var(--gold)}.k2{background:#CFE0FF}.k3{background:#FFD3D3}.k4{background:#C9F2D9}
.slot.empty{border-style:dashed;opacity:.6}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.meter{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}
.chk{border:2.5px solid var(--ink);border-radius:14px;padding:10px;font-weight:700;font-size:14px;display:flex;gap:8px;align-items:center;background:var(--soft)}
.chk i{flex:none;width:26px;height:26px;border-radius:50%;border:2.5px solid var(--ink);display:grid;place-items:center;font-style:normal;font-size:14px;background:#FFFFFF}
.chk.on{background:#C9F2D9}.chk.on i{background:var(--green);color:#FFFFFF}
.verdict{font-family:var(--display);font-weight:600;font-size:22px;display:flex;align-items:center;gap:12px}
.verdict img{width:54px}
.hl{background:var(--soft);border-radius:14px;padding:14px;font-size:15px;font-weight:600;white-space:pre-wrap;overflow-wrap:anywhere;max-height:320px;overflow:auto;border:2px solid #D6E0F2}
.hl .m1{background:var(--gold)}.hl .m2{background:#CFE0FF}.hl .m3{background:#FFD3D3}.hl .m4{background:#C9F2D9}
.hl span{border-radius:4px;padding:0 2px}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:22px}
.confetti i{position:absolute;top:-10px;width:10px;height:14px;border-radius:3px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(520px) rotate(540deg);opacity:0}}

/* scenes */
.studio{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:26px;align-items:start}
.board-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.tally{display:flex;gap:8px;flex-wrap:wrap}
.tally span{border:2.5px solid var(--ink);border-radius:999px;padding:2px 10px;font-weight:800;font-size:13px}
.board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.scene{border:3px solid var(--ink);border-radius:16px;padding:10px 12px 12px;background:#FFFFFF;display:flex;flex-direction:column;gap:8px;box-shadow:0 4px 0 var(--ink);min-width:0}
.scene .hd{display:flex;align-items:center;gap:8px}
.num{flex:none;width:32px;height:32px;border-radius:50%;border:2.5px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-weight:700;background:var(--gold)}
.stg{font-family:var(--display);font-weight:600;font-size:15px;flex:1;min-width:0}
.tag{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:2px 8px;border:2px solid var(--ink);flex:none}
.tag.ai{background:#FFE0CC}.tag.me{background:#C9F2D9}.tag.remix{background:#CFE0FF}
.scene textarea{min-height:88px;font-size:14.5px}
.tools{display:flex;gap:6px}
.tools button{appearance:none;cursor:pointer;width:32px;height:30px;border:2.5px solid var(--ink);border-radius:9px;background:var(--soft);display:grid;place-items:center;font-weight:800;font-size:14px}
.tools button:hover{background:var(--gold)}
.tools button.x:hover{background:#FFD3D3}
.tools button:disabled{opacity:.3;cursor:not-allowed;background:var(--soft)}
.empty-slot{border:3px dashed var(--ink);border-radius:16px;display:grid;place-items:center;min-height:150px;background:rgba(255,255,255,.55)}
.bin{margin-top:18px;border:2.5px dashed var(--ink);border-radius:16px;padding:12px;background:rgba(255,255,255,.6)}
.bin ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.bin li{display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:14px;font-weight:600;background:#FFFFFF;border-radius:10px;padding:6px 10px;border:2px solid #D6E0F2}
.bin li span{min-width:0;overflow-wrap:anywhere;opacity:.75}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#FFF4D6;border:2.5px solid var(--ink);border-radius:12px;padding:8px 10px;font-weight:700;font-size:14px}

/* tricks */
.screen{position:relative;aspect-ratio:16/9;border:4px solid var(--ink);border-radius:18px;overflow:hidden;background:#0B1026;box-shadow:0 8px 0 var(--ink)}
.scene-art{position:absolute;inset:0}
.scene-art svg{position:absolute;inset:0;width:100%;height:100%}
.scene-art .bolt{position:absolute;left:56%;bottom:12%;height:44%;width:auto;max-width:none}
.cam{position:absolute;inset:0;transform-origin:67.5% 55%;animation:zoom 9s ease-in-out infinite}
@keyframes zoom{0%,28%{transform:scale(1)}34%,61%{transform:scale(1.75)}67%,94%{transform:scale(2.7)}100%{transform:scale(1)}}
.vf{position:absolute;inset:14px;pointer-events:none}
.vf i{position:absolute;width:30px;height:30px;border:4px solid #FFFFFF}
.vf i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}.vf i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}
.vf i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}.vf i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}
.rec{position:absolute;right:46px;top:10px;display:flex;align-items:center;gap:6px;color:#FFFFFF;font-weight:800;font-size:14px;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.rec b{width:12px;height:12px;border-radius:50%;background:var(--red);animation:blink 1.2s infinite}
@keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}
.lbls{position:absolute;left:46px;top:10px}
.lbls span{position:absolute;white-space:nowrap;font-family:var(--display);font-weight:700;font-size:clamp(14px,2vw,20px);background:var(--gold);border:3px solid var(--ink);border-radius:10px;padding:1px 10px;opacity:0}
.a1{animation:s1 9s infinite}.a2{animation:s2 9s infinite}.a3{animation:s3 9s infinite}
@keyframes s1{0%,30%{opacity:1}33%,97%{opacity:0}100%{opacity:1}}
@keyframes s2{0%,31%{opacity:0}34%,62%{opacity:1}65%,100%{opacity:0}}
@keyframes s3{0%,64%{opacity:0}67%,95%{opacity:1}98%,100%{opacity:0}}
.legend{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:22px}
.leg{border:3px solid var(--ink);border-radius:16px;background:#FFFFFF;overflow:hidden;box-shadow:0 4px 0 var(--ink)}
.leg .mini{position:relative;aspect-ratio:16/9;overflow:hidden;border-bottom:3px solid var(--ink)}
.leg .mini .cam{animation:none}
.leg .txt{padding:8px 10px}
.leg b{font-family:var(--display);font-size:19px;display:block}
.leg span{font-size:13px;font-weight:700;color:var(--grey)}
.leg.h1{animation:g1 9s infinite}.leg.h2{animation:g2 9s infinite}.leg.h3{animation:g3 9s infinite}
@keyframes g1{0%,30%{background:var(--gold)}33%,100%{background:#FFFFFF}}
@keyframes g2{0%,31%{background:#FFFFFF}34%,62%{background:var(--gold)}65%,100%{background:#FFFFFF}}
@keyframes g3{0%,64%{background:#FFFFFF}67%,95%{background:var(--gold)}98%,100%{background:#FFFFFF}}
.mood{position:absolute;inset:0}
.mood.m1{animation:f1 9s infinite}.mood.m2{animation:f2 9s infinite;opacity:0}.mood.m3{animation:f3 9s infinite;opacity:0}
@keyframes f1{0%,31%{opacity:1}35%,96%{opacity:0}100%{opacity:1}}
@keyframes f2{0%,30%{opacity:0}34%,64%{opacity:1}68%,100%{opacity:0}}
@keyframes f3{0%,63%{opacity:0}67%,97%{opacity:1}100%{opacity:0}}
.tint{position:absolute;inset:0;pointer-events:none}
.rain{position:absolute;inset:0;background-image:repeating-linear-gradient(105deg,rgba(255,255,255,.55) 0 2px,transparent 2px 26px);background-size:200px 200px;animation:rain .5s linear infinite;opacity:.55}
@keyframes rain{to{background-position:-40px 200px}}
.spot{position:absolute;inset:0;background:radial-gradient(circle at 67.5% 62%,rgba(255,240,200,.18) 0 13%,rgba(4,6,20,.78) 27%)}
.flash{position:absolute;inset:0;background:#FFFFFF;opacity:0;animation:flash 3s infinite}
@keyframes flash{0%,78%,86%,100%{opacity:0}80%{opacity:.55}83%{opacity:.15}84%{opacity:.4}}
.sun-pulse{animation:pulse 3s ease-in-out infinite;transform-origin:1300px 300px;transform-box:view-box}
@keyframes pulse{50%{transform:scale(1.08)}}

/* storyboard */
.frames{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.frame{border:3px solid var(--ink);border-radius:18px;background:#FFFFFF;box-shadow:0 5px 0 var(--ink);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.frame .shot{position:relative;aspect-ratio:16/9;background:repeating-linear-gradient(45deg,#F4F8FF 0 12px,#E9F0FC 12px 24px);display:grid;place-items:center;cursor:pointer;border-bottom:3px solid var(--ink)}
.frame .shot img{width:100%;height:100%;object-fit:cover}
.frame .shot.over{outline:5px solid var(--blue);outline-offset:-8px}
.frame .shot .ph{font-family:var(--display);font-weight:600;font-size:16px;text-align:center;padding:10px}
.frame .shot .ph small{display:block;font-family:var(--body);font-size:12px;color:var(--grey)}
.frame .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px}
.frame .cap{font-size:14px;font-weight:700;overflow-wrap:anywhere}
.frame .cap.none{color:var(--grey);font-style:italic}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{appearance:none;border:2px solid var(--ink);background:var(--soft);border-radius:999px;padding:1px 9px;font-size:12.5px;font-weight:800;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:#FFFFFF}
.chip.w[aria-pressed="true"]{background:var(--orange);color:var(--ink)}
.chip.c[aria-pressed="true"]{background:#7FA8F5;color:var(--ink)}
.chip.d[aria-pressed="true"]{background:#2B2846;color:#FFFFFF}
.finish{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;background:var(--gold);border:3px solid var(--ink);border-radius:24px;box-shadow:0 8px 0 var(--ink);padding:22px 24px;margin-top:34px;position:relative}
.finish h3{font-size:30px}
.finish ul{margin:8px 0 0;padding:0;list-style:none;display:flex;gap:8px;flex-wrap:wrap}
.finish li{background:#FFFFFF;border:2.5px solid var(--ink);border-radius:999px;padding:2px 10px;font-weight:800;font-size:13px}
.finish li.no{opacity:.5;text-decoration:line-through}

@media (max-width:980px){
  .tabs{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:86px}
}
@media (max-width:900px){
  .grid,.studio{grid-template-columns:minmax(0,1fr)}
  .meter{grid-template-columns:repeat(2,minmax(0,1fr))}
  .frames{grid-template-columns:repeat(2,minmax(0,1fr))}
  .finish{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:600px){
  .two,.board,.steps,.legend,.frames,.ai-row{grid-template-columns:minmax(0,1fr)}
  .tabs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tab{font-size:16px;padding:10px}
  .tab small{display:none}
  .title{margin-bottom:80px}
}
@media (prefers-reduced-motion:reduce){
  .hang,.perch,.cam,.lbls span,.leg,.mood,.rain,.flash,.sun-pulse,.rec b{animation:none!important}
  .lbls .a1{opacity:1}
  .tcard{transition:none}
}
</style>
</head>

<div class="band"><div class="wrap"><span>PUMO Technovation · SMK Puchong</span><span>AI-Assisted Digital Storytelling</span></div></div>

  </div>
</header>
<main class="wrap">
  <nav class="tabs" id="tabs" aria-label="Stations"></nav>

function copyText(text, anchor){
  const fall=()=>{ if(!anchor) return; const host=anchor.closest(".box")||anchor.parentElement; let box=host.querySelector(".copyfall");
    if(!box){box=document.createElement("div"); box.className="copyfall"; box.innerHTML='<p class="note">Copying was blocked. Select all of this text and copy it yourself:</p><textarea readonly></textarea>'; host.appendChild(box);}
    const ta=box.querySelector("textarea"); ta.value=text; ta.focus(); ta.select(); };
  try{ return navigator.clipboard.writeText(text).then(()=>true,()=>{fall();return false;}); }catch(e){ fall(); return Promise.resolve(false); }
}

/* ---------- background remover ---------- */
function removeBg(im, tol){
  const m=600, s=Math.min(1,m/Math.max(im.width,im.height));
  const W=Math.round(im.width*s), H=Math.round(im.height*s);
  const cv=document.createElement("canvas"); cv.width=W; cv.height=H; const ctx=cv.getContext("2d");
  ctx.drawImage(im,0,0,W,H);
  const id=ctx.getImageData(0,0,W,H), d=id.data;
  const border=[]; for(let x=0;x<W;x++){border.push(x, (H-1)*W+x);} for(let y=0;y<H;y++){border.push(y*W, y*W+W-1);}
  const transparentEdge=border.filter(i=>d[i*4+3]<20).length/border.length;
  let removed=false;
  if(transparentEdge<.5){
    const med=ch=>{ const v=border.map(i=>d[i*4+ch]).sort((a,b)=>a-b); return v[v.length>>1]; };
    const bg=[med(0),med(1),med(2)];
    const dist=i=>Math.max(Math.abs(d[i*4]-bg[0]),Math.abs(d[i*4+1]-bg[1]),Math.abs(d[i*4+2]-bg[2]));
    const plain=border.filter(i=>dist(i)<=tol).length/border.length;
    if(plain>.55){
      const seen=new Uint8Array(W*H), q=new Int32Array(W*H); let h=0,t=0;
      border.forEach(i=>{ if(!seen[i]&&dist(i)<=tol){seen[i]=1;q[t++]=i;} });
      while(h<t){ const i=q[h++], x=i%W, y=(i/W)|0;
        const nb=[x>0?i-1:-1, x<W-1?i+1:-1, y>0?i-W:-1, y<H-1?i+W:-1];
        for(const n of nb){ if(n>=0&&!seen[n]&&dist(n)<=tol){seen[n]=1;q[t++]=n;} } }
      for(let i=0;i<W*H;i++){ if(seen[i]) d[i*4+3]=0; }
      for(let i=0;i<W*H;i++){ if(seen[i]) continue; const x=i%W,y=(i/W)|0;
        if((x>0&&seen[i-1])||(x<W-1&&seen[i+1])||(y>0&&seen[i-W])||(y<H-1&&seen[i+W])){ const dd=dist(i); if(dd<tol*2.5) d[i*4+3]=Math.max(0,Math.min(255,Math.round(255*(dd-tol)/(tol*1.5)))); } }
      ctx.putImageData(id,0,0); removed=true;
    }
  }
  let x0=W,y0=H,x1=0,y1=0; for(let y=0;y<H;y++) for(let x=0;x<W;x++){ if(d[(y*W+x)*4+3]>12){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; } }
  if(x1<=x0||y1<=y0) return {url:cv.toDataURL("image/png"),removed:false};
  const pad=6; x0=Math.max(0,x0-pad); y0=Math.max(0,y0-pad); x1=Math.min(W-1,x1+pad); y1=Math.min(H-1,y1+pad);
  const out=document.createElement("canvas"); out.width=x1-x0+1; out.height=y1-y0+1; out.getContext("2d").drawImage(cv,x0,y0,out.width,out.height,0,0,out.width,out.height);
  return {url:out.toDataURL("image/png"),removed};
}

const STOP=new Set("the and with that they their them when want wants must but have from this into will your very about what were been being also only just more most some than then there these those over under after before because while where which who whom whose would could should every school".split(" "));
const kws=s=>[...new Set((s||"").toLowerCase().match(/[a-z]{4,}/g)||[])].filter(w=>!STOP.has(w));
function matchCheck(text){
  const t=(text||"").toLowerCase(); const has=w=>t.includes(w.slice(0,Math.min(w.length,6)));
  const name=(S.card.name.trim().split(/\s+/)[0]||"").toLowerCase();
  const gk=kws(S.card.goal), pk=kws(S.logline.problem), ak=kws(S.logline.action);
  return { hero:!!name&&t.includes(name), goal:gk.some(has),
    problem:pk.some(has)||/\b(but|until|however|can't|cannot|fails?|lost|loses|broke|broken|problem|trouble|rival|afraid|scared|danger)\b/.test(t),
    change:ak.some(has)||/\b(learns?|realis|realiz|decides?|finally|discovers?|changes?|must)\w*/.test(t),
    words:{m1:name.length>1?[name]:[],m2:gk,m3:pk,m4:ak} };
}
function highlight(text, words){
  let h=esc(text);
  Object.entries(words).forEach(([cls,list])=>{ list.forEach(w=>{ const stem=w.slice(0,Math.min(w.length,6)).replace(/[^a-z]/g,""); if(stem.length<2) return; h=h.replace(new RegExp(`(?<![\\w>])(${stem}[a-z]*)`,"gi"),`<span class="${cls}">$1</span>`); }); });
  return h;
}

function storyPrompt(){
  const c=S.card;
  return `Write a short story for a 60-second animated film about my original cartoon character.
Character: ${c.name.trim()||"[name]"}, ${c.look.trim()||"[look]"}. Personality: ${c.personality.trim()||"[personality]"}.
Logline: ${loglineText()}
Split the story into exactly 6 scenes. Use this format and nothing else:
Scene 1 (Setup): ...
Scene 2 (Problem): ...
Scene 3 (Rising action): ...
Scene 4 (Rising action): ...
Scene 5 (Climax): ...
Scene 6 (Resolution): ...
Keep each scene to 1 or 2 short sentences (under 25 words). Simple English, kind and school-friendly, completely original.`;
}
function splitScenes(raw){
  const txt=raw.replace(/\r/g,"").replace(/\*\*|__|#+\s?/g,"").replace(/[“”]/g,'"');
  const re=/(^|\n)[ \t>*\-•]*(?:scene\s*(\d{1,2})|(\d{1,2})\s*[.)])[^\S\n]*(?:[(\[][^)\]\n]*[)\]])?[^\S\n]*(?:[:\-–—.]\s*)?/gi;
  const marks=[]; let m; while((m=re.exec(txt))){ marks.push({i:m.index+m[1].length,end:re.lastIndex}); }
  const clean=s=>s.replace(/^(setup|problem|rising action|rising|climax|resolution|ending|the end)\b\s*[:\-–—.)]?\s*/i,"").split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean)[0]?.replace(/\s*\n\s*/g," ").trim()||"";
  let out=[];
  if(marks.length>=3){ for(let k=0;k<marks.length;k++){ const s=clean(txt.slice(marks[k].end, k+1<marks.length?marks[k+1].i:undefined)); if(s) out.push(s); } }
  else {
    const paras=txt.split(/\n\s*\n/).map(x=>x.replace(/\s*\n\s*/g," ").trim()).filter(x=>x&&!/^title\s*:/i.test(x));
    let units=paras.length>=6?paras:txt.replace(/\s+/g," ").match(/[^.!?]+[.!?]+["']?|[^.!?]+$/g)?.map(x=>x.trim()).filter(Boolean)||[];
    if(units.length<=6) out=units;
    else { const n=units.length; for(let k=0;k<6;k++){ out.push(units.slice(Math.round(k*n/6),Math.round((k+1)*n/6)).join(" ")); } }
  }
  return out.slice(0,6);
}

  const preview=()=>{ const n=S.storyRaw.trim()?splitScenes(S.storyRaw).length:0; $("#splitMsg").textContent=n?`Found ${n} scene${n>1?"s":""}.`:""; };
  const fill=list=>{ S.scenes=list.map(t=>({id:uid(),text:t,orig:t,from:"ai"})); S.binned=[]; save(); board(); toast(`${list.length} scenes on your board!`); };
  $("#split").addEventListener("click",()=>{
    const list=splitScenes(S.storyRaw||""); const ask=$("#ask");

    ask.innerHTML=`<div class="confirm" style="margin-top:12px">Replace the scenes on your board?<button class="btn sm" type="button" id="yes">Yes, replace</button><button class="btn sm" type="button" id="no">Keep my board</button></div>`;
    $("#yes").addEventListener("click",()=>{ask.innerHTML=""; fill(list);}); $("#no").addEventListener("click",()=>{ask.innerHTML="";});
  });
  $("#raw").addEventListener("paste",()=>setTimeout(()=>{ if(!S.scenes.length){ const l=splitScenes(S.storyRaw); if(l.length>=2) fill(l); } },60));
  $("#cpSt").addEventListener("click",e=>copyText(storyPrompt(),e.currentTarget).then(ok=>ok&&toast("Story prompt copied!")));
  wireAI($("#aiSt"),storyPrompt);
  const tally=()=>{ const sc=S.scenes; $("#tally").innerHTML=`<span style="background:${sc.length===6?"#C9F2D9":"#FFFFFF"}">${sc.length}/6 scenes</span><span style="background:#FFE0CC">AI ${sc.filter(s=>s.from==="ai").length}</span><span style="background:#CFE0FF">Remixed ${sc.filter(s=>s.from==="remix").length}</span><span style="background:#C9F2D9">Mine ${sc.filter(s=>s.from==="me").length}</span>`; };
  const board=()=>{

        <div class="hd"><span class="num">${i+1}</span><span class="stg">${STAGES[i]||"Extra scene"}</span><span class="tag ${s.from}">${TAG[s.from]}</span></div>

      </div>`).join("")+(sc.length<6?Array.from({length:6-sc.length},(_,k)=>`<div class="empty-slot"><button class="btn sm" type="button" data-add>+ Add my own scene ${sc.length+k+1}</button></div>`).join(""):"");
    $$(".scene",B).forEach(el=>{
      const s=sc.find(x=>x.id===el.dataset.id), ta=$("textarea",el), tag=$(".tag",el);
      ta.addEventListener("input",()=>{ s.text=ta.value; if(s.from!=="me"){ s.from=ta.value.trim()===(s.orig||"").trim()?"ai":"remix"; tag.className="tag "+s.from; tag.textContent=TAG[s.from]; } save(); tally(); });
      $$("[data-mv]",el).forEach(b=>b.addEventListener("click",()=>{ const i=sc.indexOf(s), j=i+ +b.dataset.mv; if(j<0||j>=sc.length) return; [sc[i],sc[j]]=[sc[j],sc[i]]; save(); board(); }));
      $("[data-rm]",el).addEventListener("click",()=>{ sc.splice(sc.indexOf(s),1); if(s.text.trim()) S.binned.unshift(s); save(); board(); toast("Binned. Add your own idea, or bring it back below."); });
    });
    $$("[data-add]",B).forEach(b=>b.addEventListener("click",()=>{ sc.push({id:uid(),text:"",orig:"",from:"me"}); save(); board(); const all=$$(".scene textarea",B); all[all.length-1]?.focus(); }));

    $$("[data-back]",bin).forEach(b=>b.addEventListener("click",()=>{ const s=S.binned.splice(+b.dataset.back,1)[0]; sc.push(s); save(); board(); }));
  };
  bind(v,()=>{ paintPrompt(); preview(); }); paintPrompt(); preview(); board();
}

const SHOTS=[["wide","Wide"],["medium","Medium"],["close","Close-up"]];
const MOODL=[["warm","Warm","w"],["cool","Cool","c"],["dark","Dark","d"]];
async function frameImage(file){ const im=await readImage(file); const m=1100, s=Math.min(1,m/im.width); const cv=document.createElement("canvas"); cv.width=Math.round(im.width*s); cv.height=Math.round(im.height*s); const x=cv.getContext("2d"); x.fillStyle="#FFFFFF"; x.fillRect(0,0,cv.width,cv.height); x.drawImage(im,0,0,cv.width,cv.height); return cv.toDataURL("image/jpeg",.82); }
function vBoard(v,st){
  v.innerHTML=headHTML(st,"Bring in your Canva storyboard","keys","Download your six Canva pages as pictures, drop them in, then tag each frame's camera shot and mood.")+
  `<div class="box" style="--accent:#FFC98C;margin-bottom:22px">

    <div class="row"><button class="btn main jiggle" id="addAll" type="button" style="background:#FFC98C">Add all my scenes at once${hang("keys",28,12,"left:86%;top:calc(100% + 4px);--dur:2.9s")}</button><input type="file" id="multi" accept="image/*" multiple hidden><span class="note" style="margin-left:6px">They fill the empty frames in order: name them 1, 2, 3… in Canva's order.</span></div>
  </div>
  <div class="frames" id="frames"></div>
  <div class="finish" id="finish"></div>`;
  const paint=()=>{
    $("#frames").innerHTML=S.frames.map((f,i)=>{ const sc=S.scenes[i]; return `<div class="frame" data-i="${i}">
      <div class="shot" role="button" tabindex="0" aria-label="Add a picture for frame ${i+1}">${f.img?`<img src="${f.img}" alt="Storyboard frame ${i+1}">`:`<span class="ph">Frame ${i+1}<small>Click or drop your Canva page</small></span>`}</div>
      <div class="body">
        <div class="row" style="gap:8px;flex-wrap:nowrap"><span class="num">${i+1}</span><span class="stg">${STAGES[i]}</span>${f.img?`<button class="btn sm" type="button" data-clear style="padding:2px 8px">Remove</button>`:""}</div>
        <p class="cap ${sc&&sc.text.trim()?"":"none"}">${sc&&sc.text.trim()?esc(sc.text):"No scene text yet. Write it in station 3."}</p>
        <div class="chips">${SHOTS.map(([k,l])=>`<button class="chip" type="button" data-shot="${k}" aria-pressed="${f.shot===k}">${l}</button>`).join("")}</div>
        <div class="chips">${MOODL.map(([k,l,c])=>`<button class="chip ${c}" type="button" data-mood="${k}" aria-pressed="${f.mood===k}">${l}</button>`).join("")}</div>
      </div></div>`; }).join("");
    $$(".frame",v).forEach(el=>{
      const i=+el.dataset.i, f=S.frames[i], shot=$(".shot",el);
      const inp=document.createElement("input"); inp.type="file"; inp.accept="image/*"; inp.hidden=true; el.appendChild(inp);
      const put=async file=>{ try{ f.img=await frameImage(file); save(); paint(); finish(); }catch(e){ toast("That file isn't a picture we can read."); } };
      shot.addEventListener("click",()=>inp.click()); shot.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();inp.click();}});
      inp.addEventListener("change",()=>{ if(inp.files[0]) put(inp.files[0]); });
      ["dragenter","dragover"].forEach(t=>shot.addEventListener(t,e=>{e.preventDefault();shot.classList.add("over");}));
      ["dragleave","drop"].forEach(t=>shot.addEventListener(t,()=>shot.classList.remove("over")));
      shot.addEventListener("drop",e=>{e.preventDefault(); const file=[...(e.dataTransfer?.files||[])].find(x=>x.type.startsWith("image/")); if(file) put(file);});
      const c=$("[data-clear]",el); if(c) c.addEventListener("click",()=>{ f.img=""; save(); paint(); finish(); });
      $$("[data-shot]",el).forEach(b=>b.addEventListener("click",()=>{ f.shot=f.shot===b.dataset.shot?"":b.dataset.shot; save(); paint(); }));
      $$("[data-mood]",el).forEach(b=>b.addEventListener("click",()=>{ f.mood=f.mood===b.dataset.mood?"":b.dataset.mood; save(); paint(); }));
    });
  };
  $("#addAll").addEventListener("click",()=>$("#multi").click());
  $("#multi").addEventListener("change",async e=>{
    const files=[...e.target.files].filter(f=>f.type.startsWith("image/")).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
    let slot=0, n=0;
    for(const file of files){ while(slot<6&&S.frames[slot].img) slot++; if(slot>=6) break; try{ S.frames[slot].img=await frameImage(file); n++; }catch(err){} slot++; }
    e.target.value=""; save(); paint(); finish(); toast(n?`${n} frame${n>1?"s":""} added!`:"All six frames are full. Remove one to add another.");
  });
  const finish=()=>{
    const items=[["Character card",!!S.card.name.trim()],["Sprite",!!S.card.img],["Logline",!!(S.logline.problem.trim()&&S.logline.action.trim())],["AI brainstorm",!!S.aiReply.trim()],["Six scenes",S.scenes.length===6],["Storyboard",S.frames.filter(f=>f.img).length===6]];
    $("#finish").innerHTML=`<div><h3>Your story book</h3><p style="font-weight:700">A PDF of everything you made today, to show your family.</p><ul>${items.map(([l,ok])=>`<li class="${ok?"":"no"}">${ok?"✓ ":""}${l}</li>`).join("")}</ul></div>
      <button class="btn big jiggle" type="button" id="pdfEnd" style="background:#FFFFFF">Download my story book (PDF)${hang("pumo",40,14,"left:85%;top:calc(100% + 4px);--dur:3.2s")}</button>`;
    $("#pdfEnd").addEventListener("click",makePDF);
  };
  paint(); finish();
}

/* ===== canvas drawing (card + PDF) ===== */
const FONT_D='"Fredoka","Arial Rounded MT Bold",Arial,sans-serif', FONT_B='"Nunito","Segoe UI",Arial,sans-serif';
async function fontsReady(){ try{ await Promise.all(["700 40px Fredoka","600 40px Fredoka","800 30px Nunito","700 30px Nunito","600 30px Nunito"].map(f=>document.fonts.load(f))); await document.fonts.ready; }catch(e){} }
function rr(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function boxD(ctx,x,y,w,h,fill,r=28,sh=12,lw=6){ ctx.save(); ctx.fillStyle="#0E1630"; rr(ctx,x,y+sh,w,h,r); ctx.fill(); ctx.fillStyle=fill; rr(ctx,x,y,w,h,r); ctx.fill(); ctx.lineWidth=lw; ctx.strokeStyle="#0E1630"; ctx.stroke(); ctx.restore(); }
function lines(ctx,text,maxW){ const words=String(text||"").replace(/\s+/g," ").trim().split(" "); const out=[]; let cur=""; for(const w of words){ const t=cur?cur+" "+w:w; if(ctx.measureText(t).width>maxW&&cur){ out.push(cur); cur=w; } else cur=t; } if(cur) out.push(cur); return out; }
function wrapT(ctx,text,x,y,maxW,lh,maxL=99){ let L=lines(ctx,text,maxW); if(L.length>maxL){ L=L.slice(0,maxL); let last=L[maxL-1]; while(ctx.measureText(last+"…").width>maxW&&last.length) last=last.slice(0,-1); L[maxL-1]=last.replace(/\s+$/,"")+"…"; } L.forEach((l,i)=>ctx.fillText(l,x,y+i*lh)); return L.length*lh; }
function fitFont(ctx,text,weight,family,size,maxW,min=18){ let s=size; do{ ctx.font=`${weight} ${s}px ${family}`; s-=2; }while(ctx.measureText(text).width>maxW&&s>min); }
function contain(ctx,im,x,y,w,h,pad=0){ const s=Math.min((w-pad*2)/im.width,(h-pad*2)/im.height); const iw=im.width*s, ih=im.height*s; ctx.drawImage(im,x+(w-iw)/2,y+(h-ih)/2,iw,ih); }
function cover(ctx,im,x,y,w,h){ const s=Math.max(w/im.width,h/im.height); const iw=im.width*s, ih=im.height*s; ctx.drawImage(im,x+(w-iw)/2,y+(h-ih)/2,iw,ih); }
function sunburst(ctx,cx,cy,R,a="#FFE79A",b="#FFF5CF"){ const n=36; for(let i=0;i<n;i++){ ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,R,i*2*Math.PI/n,(i+1)*2*Math.PI/n); ctx.closePath(); ctx.fillStyle=i%2?a:b; ctx.fill(); } }
function pill(ctx,text,x,y,bg,fg="#0E1630",size=22){ ctx.font=`600 ${size}px ${FONT_D}`; const w=ctx.measureText(text).width+size*1.1, h=size*1.55; ctx.fillStyle=bg; rr(ctx,x,y,w,h,h/2); ctx.fill(); ctx.lineWidth=3; ctx.strokeStyle="#0E1630"; ctx.stroke(); ctx.fillStyle=fg; ctx.textBaseline="middle"; ctx.fillText(text,x+size*.55,y+h/2+1); ctx.textBaseline="alphabetic"; return w; }
async function hangDraw(ctx,name,x,y,w,L,rot=0){ const s=SPR[name]; const im=await loadImg(s.src); const h=w*s.ar; ctx.save(); ctx.translate(x,y); ctx.rotate(rot*Math.PI/180); ctx.strokeStyle="#0E1630"; ctx.lineWidth=3;
  if(name==="hex"){ [s.a,s.b].forEach(f=>{ctx.beginPath(); ctx.moveTo(-w*.5+w*f,0); ctx.lineTo(-w*.5+w*f,L); ctx.stroke();}); ctx.drawImage(im,-w*.5,L-h*s.hy,w,h); }
  else { ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,L); ctx.stroke(); ctx.drawImage(im,-w*s.hx,L-h*s.hy,w,h); } ctx.restore(); }

async function drawCard(){
  await fontsReady();
  const c=S.card, W=760, H=1150, cv=document.createElement("canvas"); cv.width=W; cv.height=H; const x=cv.getContext("2d");
  boxD(x,14,8,W-28,H-40,"#FFC20E",48,20,8);
  const ix=42, iy=36, iw=W-84, ih=980;
  x.save(); rr(x,ix,iy,iw,ih,32); x.fillStyle="#FFFFFF"; x.fill(); x.clip();
  x.fillStyle="#1F3864"; x.fillRect(ix,iy,iw,112);
  x.fillStyle="#FFFFFF"; fitFont(x,c.name||"Your hero","700",FONT_D,58,iw-200); x.textBaseline="middle"; x.fillText(c.name||"Your hero",ix+26,iy+58);
  x.font=`600 24px ${FONT_D}`; x.globalAlpha=.8; x.textAlign="right"; x.fillText("Card #001",ix+iw-24,iy+58); x.textAlign="left"; x.globalAlpha=1; x.textBaseline="alphabetic";
  const py=iy+112, ph=420; x.save(); x.beginPath(); x.rect(ix,py,iw,ph); x.clip(); sunburst(x,ix+iw/2,py+ph*.6,900); x.restore();
  if(c.img){ const im=await loadImg(c.img); x.save(); x.shadowColor="rgba(14,22,48,.22)"; x.shadowOffsetY=10; contain(x,im,ix,py,iw,ph,36); x.restore(); }
  else { x.fillStyle="#0E1630"; x.font=`600 30px ${FONT_D}`; x.textAlign="center"; x.fillText("No picture yet",ix+iw/2,py+ph/2); x.textAlign="left"; }
  x.fillStyle="#0E1630"; x.fillRect(ix,py+ph,iw,6);
  let y=py+ph+48; x.fillStyle="#5B6787"; x.font=`700 26px ${FONT_B}`; y+=wrapT(x,c.look||"",ix+26,y,iw-52,34,2); y+=12;

async function makePDF(){
  if(!window.jspdf){ toast("The PDF maker didn't load. Refresh the page and try again."); return; }
  toast("Making your story book…");
  try{
    const pages=await pdfPages(); const {jsPDF}=window.jspdf; const doc=new jsPDF({unit:"pt",format:"a4",compress:true});
    pages.forEach((cv,i)=>{ if(i) doc.addPage(); doc.addImage(cv.toDataURL("image/jpeg",.9),"JPEG",0,0,595.28,841.89); });
    doc.save(`${fileName(S.creator||S.card.name)}_Story_Book.pdf`); toast("Story book downloaded!");
  }catch(e){ console.error(e); toast("Something went wrong making the PDF. Try again."); }
}
$("#pdfTop").addEventListener("click",makePDF);

function route(){

  const id=(location.hash||"").slice(1); const key=VIEWS[id]?id:"card"; const st=ST.find(s=>s.id===key);
  $$("#tabs .tab").forEach(a=>{ if(a.dataset.id===key) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
